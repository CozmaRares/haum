server {
    listen 80;
    server_name grafic.raru.dev;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name grafic.raru.dev;

    ssl_certificate /etc/letsencrypt/live/grafic.raru.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grafic.raru.dev/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        limit_req zone=site_per_ip burst=30 nodelay;

        proxy_pass http://grafic:3000;

        proxy_http_version 1.1;

        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
