services:
  nginx:
    image: nginx:1.30.2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - reverse-proxy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  reverse-proxy:
    external: true
